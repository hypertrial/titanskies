[project]
name = "titanskies"
version = "0.1.5"
description = "Self-hosted North American smoke, air-quality, and wildfire data publisher"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11.0",
  "requests>=2.32",
  "eccodes>=2.43",
  "eccodeslib==2.48.0.26",
  "tifffile>=2024.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "packaging>=24.2",
  "pytest>=8.3",
  "ruff>=0.13",
]

[tool.mypy]
python_version = "3.12"
files = [
  "ingest",
  "api",
  "scripts",
  "tests/python",
]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "normal"
explicit_package_bases = true
show_error_codes = true

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["ingest", "api", "scripts", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ingest", "api"]

[tool.ruff.lint.per-file-ignores]
"tests/python/test_release.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
addopts = "-q"
