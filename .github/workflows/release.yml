name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - run: npm ci && uv sync --frozen --all-extras
      - run: npx playwright install --with-deps chromium webkit
      - run: ./scripts/verify_release.sh
      - name: Build release files
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(node -p 'require("./package.json").version')" = "$version"
          git archive --format=tar.gz --prefix="titanskies-$version/" -o "titanskies-$version.tar.gz" HEAD
          cp artifacts/license-report.json "license-report-$version.json"
          cp artifacts/THIRD_PARTY_NOTICES.md "THIRD_PARTY_NOTICES-$version.md"
          uv run scripts/generate_sbom.py "sbom-$version.cdx.json"
          sha256sum "titanskies-$version.tar.gz" "license-report-$version.json" "THIRD_PARTY_NOTICES-$version.md" "sbom-$version.cdx.json" > SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hypertrial/titanskies:${{ github.ref_name }},ghcr.io/hypertrial/titanskies:latest
          provenance: mode=max
          sbom: true
      - run: cosign sign --yes "ghcr.io/hypertrial/titanskies@${{ steps.image.outputs.digest }}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: titanskies-*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes titanskies-*.tar.gz license-report-*.json THIRD_PARTY_NOTICES-*.md sbom-*.cdx.json SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem
