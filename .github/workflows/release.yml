name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: npm ci && uv sync --frozen --all-extras
      - run: npx playwright install --with-deps chromium webkit
      - run: ./scripts/verify_release.sh
      - name: Build release files
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(node -p 'require("./package.json").version')" = "$version"
          git archive --format=tar.gz --prefix="titanskies-$version/" -o "titanskies-$version.tar.gz" HEAD
          cp artifacts/license-report.json "license-report-$version.json"
          cp artifacts/THIRD_PARTY_NOTICES.md "THIRD_PARTY_NOTICES-$version.md"
          uv run scripts/generate_sbom.py "sbom-$version.cdx.json"
          sha256sum "titanskies-$version.tar.gz" "license-report-$version.json" "THIRD_PARTY_NOTICES-$version.md" "sbom-$version.cdx.json" > SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hypertrial/titanskies:${{ github.ref_name }},ghcr.io/hypertrial/titanskies:latest
          provenance: mode=max
          sbom: true
      - run: cosign sign --yes "ghcr.io/hypertrial/titanskies@${{ steps.image.outputs.digest }}"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: titanskies-*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes titanskies-*.tar.gz license-report-*.json THIRD_PARTY_NOTICES-*.md sbom-*.cdx.json SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem
