name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for a trusted manual verification run
        required: true
        default: hosted
        type: choice
        options:
          - hosted
          - mac

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'mac' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ./scripts/verify-checks

  web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'mac' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: ./scripts/verify-web

  containers:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'mac' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          docker: "true"
      - run: ./scripts/verify-containers

  verify:
    name: ${{ inputs.runner == 'mac' && 'verify-mac' || 'verify-hosted' }}
    needs: [checks, web, containers]
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'mac' && format('titanskies-release-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    environment: ${{ inputs.runner == 'mac' && 'trusted-mac' || 'release-verification' }}
    timeout-minutes: 90
    steps:
      - name: Require hosted stages
        if: inputs.runner != 'mac'
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.containers.result }}" = success
      - name: Mac checkout
        if: inputs.runner == 'mac'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mac setup
        if: inputs.runner == 'mac'
        uses: ./.github/actions/setup
        with:
          playwright: "true"
          docker: "true"
          python: "false"
      - name: Mac release gate
        if: inputs.runner == 'mac'
        run: ./scripts/verify_release.sh
