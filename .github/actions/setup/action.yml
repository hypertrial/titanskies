name: Setup TitanSkies CI
description: Node, Python, uv, optional Docker/Playwright, and tool bootstrap
inputs:
  playwright:
    description: Restore Playwright browsers and allow bootstrap to install them
    default: "false"
  docker:
    description: Install QEMU/Buildx and require Docker
    default: "false"
  python:
    description: Install CPython 3.12 (skip on Mac runners that already have it)
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: "22"
        cache: npm
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      if: inputs.python == 'true'
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        version: "0.8.22"
        enable-cache: true
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      if: inputs.docker == 'true'
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      if: inputs.docker == 'true'
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      if: inputs.playwright == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
    - run: ./scripts/bootstrap-ci-tools
      shell: bash
      env:
        SKIP_PLAYWRIGHT: ${{ inputs.playwright == 'true' && '0' || '1' }}
        SKIP_DOCKER: ${{ inputs.docker == 'true' && '0' || '1' }}
