name: titanskies

x-service: &service
  image: ghcr.io/hypertrial/titanskies:${TITANSKIES_VERSION:-v0.1.0}
  build:
    context: .
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  environment: &environment
    CONTEXT_SOURCE: ${CONTEXT_SOURCE:-live}
    TITANSKIES_DATA_DIR: /var/lib/titanskies
    TITANSKIES_CACHE_DIR: /var/cache/titanskies
    CONTEXT_WATCH_SECONDS: ${CONTEXT_WATCH_SECONDS:-900}
    FRAME_RETENTION_HOURS: ${FRAME_RETENTION_HOURS:-48}
    INGEST_BUDGET_SECONDS: ${INGEST_BUDGET_SECONDS:-300}
    INGEST_HTTP_CONCURRENCY: ${INGEST_HTTP_CONCURRENCY:-12}
    CONTEXT_SOURCE_CONCURRENCY: ${CONTEXT_SOURCE_CONCURRENCY:-3}
    HRRR_CONCURRENCY: ${HRRR_CONCURRENCY:-4}
    FIREWORK_CONCURRENCY: ${FIREWORK_CONCURRENCY:-6}
    SINAICA_CONCURRENCY: ${SINAICA_CONCURRENCY:-4}

services:
  web:
    <<: *service
    command: [web]
    environment:
      <<: *environment
      TITANSKIES_BIND_ADDR: 0.0.0.0
      TITANSKIES_PORT: 8080
    ports:
      - target: 8080
        published: ${TITANSKIES_PORT:-8080}
        host_ip: ${TITANSKIES_BIND_ADDR:-127.0.0.1}
    volumes:
      - data:/var/lib/titanskies:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest:
    <<: *service
    command: [ingest]
    environment:
      <<: *environment
      AIRNOW_API_KEY: ${AIRNOW_API_KEY:-}
    volumes:
      - data:/var/lib/titanskies
      - cache:/var/cache/titanskies
    healthcheck:
      test: [CMD, .venv/bin/python, scripts/check-publication.py]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m

volumes:
  data:
  cache:
